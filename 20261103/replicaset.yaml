apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: k8s-replicaset
  namespace: k8s-namespace
  labels:
    app: nginx
spec:
  # modify replicas according to your case
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      label:
        app: nginx
    spec:
      containers:
      - name: php-redis
        image: us-docker.pkg.dev/google-samples/containers/gke/gb-frontend:v5
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-service
  namespace: k8s-namespace
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30027

