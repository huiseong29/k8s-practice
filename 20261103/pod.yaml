apiVersion: v1                    # 쿠버네티스 API 버전
kind: Pod                         # 리소스의 종류
metadata:                         # 리소스의 메타데이터
  name: k8s-pod                   # 리소스의 이름
  namespace: k8s-namespace        # 리소스가 배포될 Namespace
  labels:
    app: nginx
spec:                             # Pod 내의 컨테이너 상세 설정
  containers:                     # Pod 안에 포함될 컨테이너의 상세 설정
  - image: nginx:latest           # 컨테이너 이미지
    name: k8s-container           # 컨테이너 이름
    ports:                        # Pod 내의 컨테이너가 리스닝하는 포트를 지정
    - containerPort: 80           # 컨테이너의 포트 번호
